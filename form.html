<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./imgs/favicon.ico">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">Eventnavn</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html" aria-current="page">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-page">
      <header class="form-intro">
        <h1>Formular</h1>
        <p>Lav en formular, der sender brugeren videre til opsamlingssiden.</p>
      </header>

      <form>
        <label for="nickname" name="nickname">NAVN</label>
        <input id="nickname" type="text" name="nickname">

        <label for="hype" name="hype">HVOR HURTIGT KAN DU LØBE 5KM?</label>
        <input id="hype" type="range" name="hype">

        <fieldset>
          <legend>HVILKET TERRÆN VIL DU LØBE I?</legend>
          <label for="flad">
            <input id="flad" type="radio" name="reason" value="flad" checked>
            FLAD
          </label>
          <label for="let">
            <input id="let" type="radio" name="reason" value="let">
            LET STIGNING
          </label>
          <label for="bakket">
            <input id="bakket" type="radio" name="reason" value="bakket">
            BAKKET
          </label>
        </fieldset>

      </form>

      <form class="form-placeholder" action="./opsamling.html"></form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>INSTAGRAM: @PACE_PEOPLE</p>
      <p class="contact">KONTAKT: PACEANDPEOPLE@GMAIL.COM</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
